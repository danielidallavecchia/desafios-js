<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Calculadora</title>
        <link rel="stylesheet" href="style.css">
        <script src="../jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    </head>
    <body>
        <div class="calculadora">
            <div class="fundo">

                <div class="tela">
                    <div class="barra-superior">
                        <div class="barra-som"></div>
                        <div class="barra-camera"></div>
                    </div>
                    <div class="barra-celular">
                        <span>8:41</span>
                        <span>
                            <img src="../img/sinal_celular.png">
                            <img src="../img/sinal_wifi.png">
                            <img src="../img/bateria_celular.png">
                        </span>
                    </div>

                    <div class="resposta" id="resposta">0</div>

                    <div class="resposta-err" id="resposta-err">
                        <div class="historico"></div>
                        <span class="msg-erro" id="msg-erro">Expressão mal formatada</span>
                    </div>

                    <div class="teclado" id="teclado">
                        <button class="tecla botao-cinza" id="ac">AC</button>
                        <button class="tecla botao-cinza">+/-</button>
                        <button class="tecla botao-cinza" id="porcentagem">%</button>
                        <button class="tecla botao-amarelo" id="divide">÷</button>

                        <button class="tecla botao-cinzaescuro">7</button>
                        <button class="tecla botao-cinzaescuro">8</button>
                        <button class="tecla botao-cinzaescuro">9</button>
                        <button class="tecla botao-amarelo" id="multiplica">x</button>

                        <button class="tecla botao-cinzaescuro">4</button>
                        <button class="tecla botao-cinzaescuro">5</button>
                        <button class="tecla botao-cinzaescuro">6</button>
                        <button class="tecla botao-amarelo" id="subtrai">-</button>

                        <button class="tecla botao-cinzaescuro">1</button>
                        <button class="tecla botao-cinzaescuro">2</button>
                        <button class="tecla botao-cinzaescuro">3</button>
                        <button class="tecla botao-amarelo" id="soma">+</button>

                        <button class="tecla botao-cinzaescuro botao-zero">0</button>
                        <button class="tecla botao-cinzaescuro" id="ponto">,</button>
                        <button class="tecla botao-amarelo" id="igual">=</button>      
                    </div>

                    <div class="barra-inferior">
                        <div class="barrinha"></div>
                    </div>
                </div>
            </div>
        </div>
    </body>

</html>

<script src="script.js"></script>
